databases:
  - name: LibNote-web-db
    databaseName: libnote_web_db_d5ug
    user: libnote_web_db_d5ug_user
    region: Oregon

services:
  - type: web
    name: LibNote-web-db
    env: ruby
    region: Oregon
    plan: free
    buildCommand: "./bin/render-build.sh"
    startCommand: "bundle exec puma -C config/puma.rb"
    preDeployCommand: ./bin/rails db:migrate
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: LibNote-web-db
          property: connectionString
      - key: RAILS_MASTER_KEY
        sync: false
      - key: WEB_CONCURRENCY
        value: 2