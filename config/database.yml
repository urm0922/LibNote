default: &default
  adapter: sqlite3
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  <<: *default
  database: storage/development.sqlite3

# The test database is temporary and may be erased and recreated at any time.
test:
  <<: *default
  database: storage/test.sqlite3

# Render supplies the PostgreSQL connection string as DATABASE_URL.
production:
  <<: *default
  adapter: postgresql
  encoding: unicode
  pool: 5
